{% extends "base.html" %}
{% block title %}Reset Password — VideoForge{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-box">
    <h1 class="auth-box__title">Forgot password?</h1>
    <p class="auth-box__sub">Enter your email and we'll generate a reset link.</p>

    {% if error %}
    <div class="flash flash--error" role="alert">{{ error }}</div>
    {% endif %}

    <form class="auth-form" method="POST" action="/forgot-password" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label class="form-label" for="email">{{ t.login_email }}</label>
        <input
          class="input" type="email" id="email" name="email"
          value="{{ form_email or '' }}"
          autocomplete="email" required aria-required="true"
          placeholder="you@example.com"
        >
      </div>

      <button class="btn btn--primary btn--full" type="submit">Send reset link</button>
    </form>

    <p class="text-center text-sm text-muted mt-24">
      Remembered your password?
      <a href="/login">{{ t.nav_login }}</a>
    </p>
  </div>
</div>
{% endblock %}
