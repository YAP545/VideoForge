{% extends "base.html" %}
{% block title %}Set New Password — VideoForge{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-box">
    <h1 class="auth-box__title">Set new password</h1>
    <p class="auth-box__sub">Choose a strong password with at least 8 characters.</p>

    {% if error %}
    <div class="flash flash--error" role="alert">{{ error }}</div>
    {% endif %}

    <form class="auth-form" method="POST" action="/reset-password/{{ token }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label class="form-label" for="password">New password</label>
        <input
          class="input" type="password" id="password" name="password"
          autocomplete="new-password" required aria-required="true"
          placeholder="••••••••" minlength="8"
        >
        <p class="form-hint">At least 8 characters.</p>
      </div>

      <button class="btn btn--primary btn--full" type="submit">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
