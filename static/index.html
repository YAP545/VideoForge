<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoForge</title>
<style>
  :root { --bg:#0e0d12; --card:#17151d; --line:#2a2733; --fg:#f1eee8; --dim:#8f8a99; --accent:#7c5cff; --bad:#ff6b5e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,"Segoe UI",sans-serif; padding:24px 16px; }
  main { max-width:960px; margin:0 auto; display:flex; flex-direction:column; gap:24px; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  h1 { margin:0; font-size:28px; }
  .badge { font-size:13px; color:var(--dim); border:1px solid var(--line); padding:2px 10px; border-radius:99px; }
  form { background:var(--card); border:1px solid var(--line); padding:16px; display:flex; flex-direction:column; gap:12px; }
  textarea { width:100%; min-height:90px; resize:vertical; background:var(--bg); color:var(--fg); border:1px solid var(--line); padding:12px; font:inherit; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  select, button { font:inherit; padding:10px 16px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  button.go { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { font-size:13px; padding:4px 10px; border-radius:99px; cursor:pointer; background:transparent; color:var(--dim); }
  .chip:hover { color:var(--fg); }
  #msg { color:var(--bad); min-height:1.4em; margin:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); display:flex; flex-direction:column; min-width:0; }
  .card video, .card .ph { width:100%; aspect-ratio:16/9; background:#000; display:grid; place-items:center; color:var(--dim); }
  .card .meta { padding:12px; display:flex; flex-direction:column; gap:6px; }
  .card p { margin:0; overflow-wrap:anywhere; font-size:14px; }
  .st { font-size:12px; color:var(--dim); }
  .st.failed { color:var(--bad); }
  .spin { width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:s 1s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>VideoForge</h1>
    <span class="badge" id="provider">mode: ...</span>
  </header>

  <form id="form">
    <label for="prompt">Describe your video</label>
    <textarea id="prompt" maxlength="500" placeholder="A paper boat sailing down a rainy street in Kolhapur, cartoon style"></textarea>
    <div class="chips" id="chips"></div>
    <div class="row">
      <label for="seconds">Length</label>
      <select id="seconds">
        <option value="3">3 seconds</option>
        <option value="4" selected>4 seconds</option>
        <option value="6">6 seconds</option>
        <option value="8">8 seconds</option>
      </select>
      <button class="go" id="submit" type="submit">Make video</button>
    </div>
    <p id="msg" role="alert"></p>
  </form>

  <section>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script>
const examples = [
  "A paper boat sailing down a rainy street, cartoon style",
  "An inventive creator waving hello in a sunny garden, 3D animation",
  "Time lapse of clouds over green hills, cinematic",
];
const $ = id => document.getElementById(id);
let timer = null;

examples.forEach(t => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = t;
  b.onclick = () => { $("prompt").value = t; };
  $("chips").appendChild(b);
});

fetch("/api/info").then(r => r.json()).then(i => { $("provider").textContent = "mode: " + i.provider; });

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("msg").textContent = "";
  const prompt = $("prompt").value.trim();
  if (prompt.length < 3) { $("msg").textContent = "Please write a longer description."; return; }
  $("submit").disabled = true;
  try {
    const r = await fetch("/api/generate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, seconds: Number($("seconds").value) }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      $("msg").textContent = typeof err.detail === "string" ? err.detail : "Could not start the video.";
    } else { $("prompt").value = ""; }
  } catch (_) { $("msg").textContent = "Cannot reach the server."; }
  $("submit").disabled = false;
  refresh();
});

function card(j) {
  const c = document.createElement("div"); c.className = "card";
  let top;
  if (j.status === "done" && j.video_url) {
    top = document.createElement("video");
    top.src = j.video_url; top.controls = true; top.loop = true; top.muted = true; top.playsInline = true;
  } else {
    top = document.createElement("div"); top.className = "ph";
    if (j.status === "failed") top.textContent = "Failed";
    else { const s = document.createElement("div"); s.className = "spin"; top.appendChild(s); }
  }
  const meta = document.createElement("div"); meta.className = "meta";
  const p = document.createElement("p"); p.textContent = j.prompt;
  const st = document.createElement("span"); st.className = "st " + j.status;
  st.textContent = j.status === "failed" ? (j.error || "Failed")
    : j.progress_text ? j.progress_text
    : j.status === "queued" ? "Waiting in line..."
    : j.status === "running" ? "Making your video..." : (j.seconds || 20) + " seconds";
  meta.append(p, st); c.append(top, meta);
  return c;
}

async function refresh() {
  try {
    const jobs = await (await fetch("/api/jobs")).json();
    const grid = $("grid");
    // keep playing videos untouched: only rebuild cards whose state or progress changed
    const sig = jobs.map(j => j.id + j.status + (j.progress_text || "")).join(",");
    if (grid.dataset.sig !== sig) {
      grid.replaceChildren(...jobs.map(card));
      grid.dataset.sig = sig;
    }
    const busy = jobs.some(j => j.status === "queued" || j.status === "running");
    clearTimeout(timer);
    if (busy) timer = setTimeout(refresh, 2000);
  } catch (_) { timer = setTimeout(refresh, 4000); }
}
refresh();
</script>
</body>
</html>
